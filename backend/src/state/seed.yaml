targetUrl: http://localhost:8020
features:
  - name: Authentication and Sign-on
    testCases:
      - id: TC001
        scenario: Verify terminal-style sign-on screen loads correctly
        given:
          - Application is running at the target URL
          - No active session exists
        when:
          - Open a browser and navigate to the target URL
          - Observe the page layout, colors, and content
        then:
          - Terminal-style sign-on screen loads with black background
          - Text is rendered in green/cyan monospace font
          - "Header displays Tran: CC00, Prog: COSGN00C, AWS Mainframe Modernization, SysID: AWSA"
          - ASCII dollar bill art is displayed on the page
          - "Yellow prompt reads: Type your User ID and Password, then press ENTER:"
          - User ID and Password input fields are present
          - ENTER=Sign-on button is visible
      - id: TC002
        scenario: Sign-on with both fields empty shows validation error
        given:
          - Application is running at the target URL
          - Sign-on screen is displayed
        when:
          - Leave the User ID field empty
          - Leave the Password field empty
          - Click the ENTER=Sign-on button
        then:
          - "Red alert message is displayed: ** Please enter both User ID and Password."
          - User remains on the sign-on screen
          - No session is created
      - id: TC003
        scenario: Sign-on with only User ID filled shows validation error
        given:
          - Application is running at the target URL
          - Sign-on screen is displayed
        when:
          - Enter the Regular User's User ID in the User ID field
          - Leave the Password field empty
          - Click the ENTER=Sign-on button
        then:
          - "Red alert message is displayed: ** Please enter both User ID and Password."
          - User remains on the sign-on screen
          - No session is created
      - id: TC004
        scenario: Sign-on with only Password filled shows validation error
        given:
          - Application is running at the target URL
          - Sign-on screen is displayed
        when:
          - Leave the User ID field empty
          - Enter the Regular User's password in the Password field
          - Click the ENTER=Sign-on button
        then:
          - "Red alert message is displayed: ** Please enter both User ID and Password."
          - User remains on the sign-on screen
          - No session is created
      - id: TC005
        scenario: Sign-on with invalid credentials shows authentication failure
        given:
          - Application is running at the target URL
          - Sign-on screen is displayed
        when:
          - Enter BADUSER in the User ID field
          - Enter BADPASS in the Password field
          - Click the ENTER=Sign-on button
        then:
          - Red alert message is displayed indicating invalid credentials
          - User remains on the sign-on screen
          - No session is created
      - id: TC006
        scenario: Sign-on with valid regular user credentials redirects to Main Menu
        given:
          - Application is running at the target URL
          - Sign-on screen is displayed
          - Regular User credentials are available
        when:
          - Login with Regular User credentials
        then:
          - User is redirected to the Main Menu page
          - "Terminal header shows Tran: CM00 and Prog: COMEN01C"
          - Live Date and Time values are displayed on the right of the header
          - Navigation bar shows Menu, Accounts, Cards, Transactions, Bill-Pay, Reports
          - Navigation bar does NOT show Users or Batch links
          - Footer shows ENTER=Continue  F3=Exit  F7=Backward  F8=Forward
      - id: TC007
        scenario: Regular user Main Menu displays correct numbered items without admin options
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Observe the Main Menu page content and numbered items
        then:
          - Page title Main Menu is displayed in white
          - Numbered menu items are listed vertically starting from 01. Account View through 10. Bill Payment
          - Admin menu items 11, 12, and 13 are NOT visible
          - "Yellow prompt reads: Please select an option : with a 2-character input field"
      - id: TC008
        scenario: Sign-on with valid admin credentials shows Admin Menu with elevated navigation
        given:
          - Application is running at the target URL
          - Sign-on screen is displayed
          - Admin credentials are available
        when:
          - Login with Admin credentials
        then:
          - User is redirected to the Main Menu page
          - Page title shows Admin Menu
          - "Extra menu items visible: 11. User List (Security), 12. User Add (Security), 13. Batch Operations"
          - Navigation bar includes Users and Batch links
          - User badge shows ADMIN in yellow
      - id: TC009
        scenario: Sign-off clears session and redirects to sign-on screen
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Click F3=Signoff in the navigation bar
        then:
          - User is redirected to the sign-on screen
          - Session is cleared
          - Sign-on screen displays with all original terminal-style elements
      - id: TC010
        scenario: Accessing application URL after sign-off does not restore previous session
        given:
          - The Regular User was previously logged in and has signed off
          - User is on the sign-on screen
        when:
          - Attempt to navigate directly to the target URL or any internal page URL
        then:
          - User is presented with the sign-on screen
          - No authenticated session is restored
          - Protected pages are not accessible without re-authenticating
      - id: TC011
        scenario: Password field masks input characters
        given:
          - Application is running at the target URL
          - Sign-on screen is displayed
        when:
          - Click on the Password input field
          - Type the Regular User's password into the Password field
          - Observe the characters displayed in the field
        then:
          - Password characters are masked and not displayed in plain text
          - The field renders dots or asterisks instead of the actual characters
      - id: TC012
        scenario: Sign-on with correct User ID but wrong password is rejected
        given:
          - Application is running at the target URL
          - Sign-on screen is displayed
          - A Regular User account exists in the system
        when:
          - Enter the Regular User's User ID in the User ID field
          - Enter WRONGPASS in the Password field
          - Click the ENTER=Sign-on button
        then:
          - Red alert message is displayed indicating invalid credentials
          - User remains on the sign-on screen
          - No session is created
      - id: TC013
        scenario: Sign-on with correct Password but wrong User ID is rejected
        given:
          - Application is running at the target URL
          - Sign-on screen is displayed
        when:
          - Enter NONEXISTENT in the User ID field
          - Enter the Regular User's password in the Password field
          - Click the ENTER=Sign-on button
        then:
          - Red alert message is displayed indicating invalid credentials
          - User remains on the sign-on screen
          - No session is created
  - name: Main Menu Navigation
    testCases:
      - id: TC014
        scenario: Successful login redirects to Main Menu with correct header and footer
        given:
          - Application is running at the target URL
          - Regular User credentials are available
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
        then:
          - Redirected to Main Menu page
          - "Terminal header shows Tran: CM00 and Prog: COMEN01C"
          - "Live Date: and Time: values are displayed on the right side of the header"
          - Footer shows ENTER=Continue  F3=Exit  F7=Backward  F8=Forward
      - id: TC015
        scenario: Main Menu displays correct title and numbered options for regular user
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Observe the Main Menu page content
        then:
          - Page title 'Main Menu' is displayed in white
          - Numbered menu items are listed vertically starting with 01. Account View
          - Menu items go up to 10. Bill Payment
          - Admin-only items 11, 12, and 13 are NOT visible
          - Yellow prompt 'Please select an option :' is shown with a 2-character input field
      - id: TC016
        scenario: Regular user navigation bar does not show admin links
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Observe the navigation bar
        then:
          - Navigation bar shows Menu, Accounts, Cards, Transactions, Bill-Pay, and Reports links
          - Users link is NOT present in the navigation bar
          - Batch link is NOT present in the navigation bar
      - id: TC017
        scenario: Selecting option 01 from Main Menu navigates to Accounts page
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Type 01 in the option input field
          - Press Enter or click ENTER=Continue
        then:
          - Navigated to the Accounts page
          - Page header shows ACCOUNTS in white
          - Subtitle reads 'Search and view credit card accounts'
      - id: TC018
        scenario: Submitting empty option field shows validation error or no navigation
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Leave the option input field empty
          - Press Enter or click ENTER=Continue
        then:
          - User remains on the Main Menu page
          - An error or prompt is displayed indicating a valid option must be selected
      - id: TC019
        scenario: Entering an invalid option number shows an error
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Type 99 in the option input field
          - Press Enter or click ENTER=Continue
        then:
          - User remains on the Main Menu page
          - An error message is displayed indicating the option is invalid or not available
      - id: TC020
        scenario: Admin user sees Admin Menu title and extra menu items
        given:
          - Application is running at the target URL
          - Admin credentials are available
        when:
          - Navigate to the target URL
          - Login with Admin credentials
          - Observe the Main Menu page
        then:
          - Page title shows 'Admin Menu'
          - Menu items 11. User List (Security), 12. User Add (Security), and 13. Batch Operations are visible
          - Navigation bar includes Users and Batch links
          - User badge shows ADMIN in yellow
      - id: TC021
        scenario: Clicking Accounts in the navigation bar navigates to Accounts page
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Click the Accounts link in the navigation bar
        then:
          - Navigated to the Accounts page
          - Page header shows ACCOUNTS
      - id: TC022
        scenario: Clicking Transactions in the navigation bar navigates to Transactions page
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Click the Transactions link in the navigation bar
        then:
          - Navigated to the Transactions page
          - Page header shows TRANSACTIONS
      - id: TC023
        scenario: Clicking Bill-Pay in the navigation bar navigates to Bill Payment page
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Click the Bill-Pay link in the navigation bar
        then:
          - Navigated to the Bill Payment page
          - Form shows Account ID input and Look Up button
      - id: TC024
        scenario: Clicking Reports in the navigation bar navigates to Reports page
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Click the Reports link in the navigation bar
        then:
          - Navigated to the Reports page
          - Form shows Report Type dropdown, Start Date, and End Date fields
      - id: TC025
        scenario: Clicking Menu in the navigation bar returns to Main Menu
        given:
          - Logged in with Regular User credentials
          - User has navigated away from Main Menu to the Accounts page
        when:
          - Click the Menu link in the navigation bar
        then:
          - Navigated back to the Main Menu page
          - Numbered menu items and option input field are displayed
      - id: TC026
        scenario: F3=Signoff from Main Menu clears session and returns to sign-on screen
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Click F3=Signoff in the navigation bar
        then:
          - Redirected to the terminal-style sign-on screen at the target URL
          - Session is cleared — user is no longer authenticated
          - Sign-on screen shows the login prompt with User ID and Password fields
      - id: TC027
        scenario: Entering non-numeric characters in the option field is handled gracefully
        given:
          - Logged in with Regular User credentials and on the Main Menu page
        when:
          - Type AB in the option input field
          - Press Enter or click ENTER=Continue
        then:
          - User remains on the Main Menu page
          - An error or no-navigation response is shown — non-numeric input is rejected or ignored
      - id: TC028
        scenario: Accessing Main Menu URL directly without login redirects to sign-on screen
        given:
          - No active session exists
        when:
          - Open a browser and navigate directly to the Main Menu URL without logging in
        then:
          - User is redirected to the sign-on screen
          - Main Menu content is not accessible without authentication
  - name: Account Search and Details
    testCases:
      - id: TC029
        scenario: Admin can search all accounts with empty Account ID field
        given:
          - Application is running at the target URL
          - Seed data is present with multiple accounts
          - Admin credentials are available
        when:
          - Navigate to the target URL
          - Login with Admin credentials
          - Click Accounts in the navigation bar
          - Leave the Account ID field empty
          - Click Search
        then:
          - Full account list loads without error
          - "Table displays multiple accounts with columns: Account ID, Status, Current Balance, Credit Limit, Open Date"
          - All accounts in the system are visible to the admin
      - id: TC030
        scenario: Regular user receives error when searching with empty Account ID
        given:
          - Application is running at the target URL
          - Regular User credentials are available
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
          - Type 01 in the main menu option field and press Enter
          - Leave the Account ID field empty
          - Click Search
        then:
          - An error message is displayed indicating that an Account ID is required
          - No account results are shown
          - User remains on the Accounts search page
      - id: TC031
        scenario: Search for a valid account by Account ID as regular user
        given:
          - Application is running at the target URL
          - Regular User credentials are available
          - Account 0000000011 exists in seed data and is linked to the Regular User
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
          - Type 01 in the main menu option field and press Enter
          - Enter 0000000011 in the Account ID field
          - Click Search
        then:
          - Account table loads with one row showing Account ID 0000000011
          - Row displays Status badge (Active or Inactive), Current Balance, Credit Limit, and Open Date
          - Table text is rendered in terminal green with cyan column headers
      - id: TC032
        scenario: Search for a non-existent Account ID returns no results
        given:
          - Application is running at the target URL
          - Regular User credentials are available
          - Account 9999999999 does not exist in the system
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
          - Type 01 in the main menu option field and press Enter
          - Enter 9999999999 in the Account ID field
          - Click Search
        then:
          - No account rows are displayed in the results table
          - An appropriate message is shown indicating no accounts were found
          - No application error or crash occurs
      - id: TC033
        scenario: Navigate to Account Details page from search results
        given:
          - Application is running at the target URL
          - Regular User credentials are available
          - Account 0000000011 exists in seed data
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
          - Type 01 in the main menu option field and press Enter
          - Enter 0000000011 in the Account ID field and click Search
          - Click on the account row for 0000000011
        then:
          - Navigated to the Account Details page
          - "Account Information section displays: Account ID, Status, Open Date, Expiration Date, Reissue Date, Group ID"
          - >-
            Financial Information section displays: Current Balance, Credit Limit, Cash Credit Limit, Current Cycle
            Credit, Current Cycle Debit
          - "Customer Information section displays: Customer Name, FICO Score"
          - Labels are rendered in cyan with colon suffix; values are rendered in green
      - id: TC034
        scenario: Account Details page shows correct data for account 0000000011
        given:
          - Application is running at the target URL
          - Regular User credentials are available
          - Account 0000000011 exists with known seed data values
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
          - Navigate to Accounts and search for 0000000011
          - Click on the account row for 0000000011
          - Observe all three detail sections on the Account Details page
        then:
          - Account ID displayed matches 0000000011
          - Status value matches the seeded status (Active or Inactive)
          - Financial values (Current Balance, Credit Limit) match seeded data
          - Customer Name and FICO Score are populated with seeded values
          - No fields are blank or show placeholder text
      - id: TC035
        scenario: View Cards button navigates to filtered card list for the account
        given:
          - Application is running at the target URL
          - Regular User credentials are available
          - Account 0000000011 has at least one associated card in seed data
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
          - Navigate to Accounts, search for 0000000011, and click on the account row
          - On the Account Details page, click the View Cards button
        then:
          - Navigated to the Cards page filtered by Account ID 0000000011
          - >-
            Card table displays associated cards with columns: Card Number (masked in magenta), Account ID, Embossed
            Name, Expiration, Status
          - Only cards belonging to account 0000000011 are shown
      - id: TC036
        scenario: Accounts page is accessible via main menu option 01
        given:
          - Application is running at the target URL
          - Regular User credentials are available
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
          - On the Main Menu, type 01 in the option field
          - Press Enter
        then:
          - Navigated to the Accounts page
          - Page header shows ACCOUNTS in white
          - Subtitle reads Search and view credit card accounts
          - Account ID search field and Search button are visible
      - id: TC037
        scenario: Accounts page is accessible via Accounts link in the navigation bar
        given:
          - Application is running at the target URL
          - Regular User credentials are available
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
          - Click Accounts in the navigation bar
        then:
          - Navigated to the Accounts page
          - Page header shows ACCOUNTS in white
          - Account ID search field and Search button are visible
      - id: TC038
        scenario: Regular user cannot access accounts belonging to other users
        given:
          - Application is running at the target URL
          - Regular User credentials are available
          - At least one account exists that is NOT linked to the Regular User
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
          - Navigate to Accounts
          - Enter an Account ID that belongs to a different user (not the Regular User)
          - Click Search
        then:
          - Either no results are returned or an access-denied error is displayed
          - The account details of the other user's account are not accessible
          - No application error or crash occurs
      - id: TC039
        scenario: Admin can view account details and access Edit Account from details page
        given:
          - Application is running at the target URL
          - Admin credentials are available
          - Account 0000000011 exists in seed data
        when:
          - Navigate to the target URL
          - Login with Admin credentials
          - Click Accounts in the navigation bar
          - Leave Account ID empty and click Search
          - Click on account row for 0000000011
        then:
          - >-
            Account Details page loads with all three sections: Account Information, Financial Information, Customer
            Information
          - Edit Account button is visible on the page
          - All field labels are in cyan and values are in green
      - id: TC040
        scenario: Back navigation from Account Details returns to account search results
        given:
          - Application is running at the target URL
          - Regular User credentials are available
          - Account 0000000011 exists in seed data
        when:
          - Navigate to the target URL
          - Login with Regular User credentials
          - Navigate to Accounts and search for 0000000011
          - Click on the account row to open Account Details
          - Click the Back button or browser back navigation
        then:
          - User is returned to the Accounts search/list page
          - Previous search results for 0000000011 are still displayed or the search form is accessible
      - id: TC041
        scenario: Account status badge displays correctly for active and inactive accounts
        given:
          - Application is running at the target URL
          - Admin credentials are available
          - Seed data contains at least one active and one inactive account
        when:
          - Navigate to the target URL
          - Login with Admin credentials
          - Click Accounts in the navigation bar
          - Leave Account ID empty and click Search
          - Observe the Status column in the account results table
        then:
          - Active accounts display an Active status badge
          - Inactive accounts display an Inactive status badge
          - Status badges are visually distinct from each other
      - id: TC042
        scenario: Accounts page not accessible without authentication
        given:
          - Application is running at the target URL
          - No active session exists
        when:
          - Open a browser and navigate directly to the Accounts page URL without logging in
        then:
          - User is redirected to the sign-on screen
          - Accounts page content is not displayed
          - Session is not established
  - name: Card View and Update
    testCases:
      - id: TC043
        scenario: Admin login and navigate to Cards page - full card list visible
        given:
          - Seed data present
          - Admin credentials are available
          - Account 0000000011 has at least one associated card
        when:
          - Navigate to the target URL
          - Login with Admin credentials
          - Click Cards in the navigation bar
        then:
          - Login succeeds and Main Menu loads with Admin Menu title
          - Cards page loads showing all cards across all accounts
          - "Card table columns visible: Card Number (masked in magenta), Account ID, Embossed Name, Expiration, Status"
          - Navigation bar includes Users and Batch links confirming admin session
      - id: TC044
        scenario: Search cards by Account ID 0000000011 and verify results
        given:
          - Logged in with Admin credentials
          - Cards page is loaded
          - Account 0000000011 has at least one card in seed data
        when:
          - Enter 0000000011 in the Account ID search field
          - Click Search
        then:
          - Card table refreshes showing only cards associated with Account ID 0000000011
          - >-
            Each row displays masked Card Number in magenta (e.g., **** **** **** 1234), Account ID, Embossed Name,
            Expiration, and Status
          - No cards from other accounts are shown
      - id: TC045
        scenario: Navigate to Card Details page by clicking a card row
        given:
          - Logged in with Admin credentials
          - Cards page is loaded with results for Account ID 0000000011
        when:
          - Click on any card row in the card list
        then:
          - Card Details page loads
          - >-
            Card Information section displays: Card Number (masked), Account ID, Embossed Name, Expiration Date, Status,
            CVV shown as ***
          - "Account Information section displays: Customer Name, Account Status, Current Balance, Credit Limit"
          - Edit Card button is visible
      - id: TC046
        scenario: Open Card Update form and verify editable vs read-only fields
        given:
          - Logged in with Admin credentials
          - Card Details page is loaded for a card under Account 0000000011
        when:
          - Note the current values for Embossed Name, Expiration Date, and Status
          - Click Edit Card
        then:
          - Card update form loads
          - Card Number is displayed as read-only (not editable)
          - "Editable fields present: Embossed Name, Expiration Month, Expiration Year, Active Status"
          - Current values are pre-populated in the editable fields
      - id: TC047
        scenario: Validation CRD-V02 - Embossed Name cannot be empty
        given:
          - Logged in with Admin credentials
          - Card update form is open for a card under Account 0000000011
        when:
          - Clear the Embossed Name field leaving it blank
          - Click Update Card
        then:
          - "Red error message displayed: 'Name can NOT be empty'"
          - Card is not updated
          - Form remains open with other field values intact
      - id: TC048
        scenario: Validation CRD-V03 - Expiration Month above valid range (13)
        given:
          - Logged in with Admin credentials
          - Card update form is open for a card under Account 0000000011
        when:
          - Enter Embossed Name = UPDATED NAME
          - Set Expiration Month to 13
          - Click Update Card
        then:
          - "Red error message displayed: 'Card expiry month must be between 1 and 12'"
          - Card is not updated
      - id: TC049
        scenario: Validation CRD-V03 - Expiration Month below valid range (0)
        given:
          - Logged in with Admin credentials
          - Card update form is open for a card under Account 0000000011
        when:
          - Enter Embossed Name = UPDATED NAME
          - Set Expiration Month to 0
          - Click Update Card
        then:
          - "Red error message displayed: 'Card expiry month must be between 1 and 12'"
          - Card is not updated
      - id: TC050
        scenario: Validation CRD-V04 - Expiration Year below valid range (1949)
        given:
          - Logged in with Admin credentials
          - Card update form is open for a card under Account 0000000011
        when:
          - Enter Embossed Name = UPDATED NAME
          - Set Expiration Month to 06
          - Set Expiration Year to 1949
          - Click Update Card
        then:
          - Red error message displayed indicating invalid card expiry year outside 1950-2099 range
          - Card is not updated
      - id: TC051
        scenario: Validation CRD-V04 - Expiration Year above valid range (2100)
        given:
          - Logged in with Admin credentials
          - Card update form is open for a card under Account 0000000011
        when:
          - Enter Embossed Name = UPDATED NAME
          - Set Expiration Month to 06
          - Set Expiration Year to 2100
          - Click Update Card
        then:
          - Red error message displayed indicating invalid card expiry year outside 1950-2099 range
          - Card is not updated
      - id: TC052
        scenario: Validation CRD-V05 - Active Status must be YES or NO
        given:
          - Logged in with Admin credentials
          - Card update form is open for a card under Account 0000000011
          - Application allows manual entry or blank selection of Active Status field
        when:
          - Enter Embossed Name = UPDATED NAME
          - Set Expiration Month to 06
          - Set Expiration Year to 2028
          - Set Active Status to a blank or invalid value if the field permits it
          - Click Update Card
        then:
          - "Red error message displayed: 'Card Status must be YES or NO'"
          - Card is not updated
      - id: TC053
        scenario: Validation CRD-V06 - No change detected when all values remain the same
        given:
          - Logged in with Admin credentials
          - Card update form is open for a card under Account 0000000011
          - Current card values are noted
        when:
          - Leave all fields exactly as pre-populated (no changes made)
          - Click Update Card
        then:
          - "Error or info message displayed: 'No change detected with respect to values fetched'"
          - Card record is not modified
      - id: TC054
        scenario: Toggle card status from Active (Y) to Inactive (N) - CRD-01
        given:
          - Logged in with Admin credentials
          - Card update form is open for a card that currently has Active Status = Y
        when:
          - Ensure Embossed Name, Expiration Month, and Expiration Year are valid and unchanged
          - Set Active Status to N
          - Click Update Card
        then:
          - "Green alert displayed: card updated successfully"
          - Card Details page or updated form shows Status as Inactive
      - id: TC055
        scenario: Toggle card status from Inactive (N) back to Active (Y) - CRD-02
        given:
          - Logged in with Admin credentials
          - The card updated in MD004-TC012 now has Active Status = N
          - Card update form is open for that card
        when:
          - Ensure Embossed Name, Expiration Month, and Expiration Year are valid and unchanged
          - Set Active Status to Y
          - Click Update Card
        then:
          - "Green alert displayed: card updated successfully"
          - Card Details page or updated form shows Status as Active
      - id: TC056
        scenario: Successful card update with valid Embossed Name and Expiration changes
        given:
          - Logged in with Admin credentials
          - Card update form is open for a card under Account 0000000011
        when:
          - Set Embossed Name to JOHN DOE UPDATED
          - Set Expiration Month to 09
          - Set Expiration Year to 2029
          - Set Active Status to Y
          - Click Update Card
        then:
          - "Green alert displayed: card updated successfully"
          - Card Details page reflects updated Embossed Name as JOHN DOE UPDATED
          - Expiration Date reflects month 09 and year 2029
