  - name: Reports and Bill Payment
    testCases:
      - id: MD008-TC001
        title: Navigate to Reports page from navigation bar
        preconditions:
          - User USER0001 exists with PASSWORD
          - Application is running at http://localhost:8020
          - Seed transaction data is present
        steps:
          - Navigate to http://localhost:8020
          - Log in as USER0001 / PASSWORD
          - Click Reports in the navigation bar
        expectedResult:
          - Reports page loads successfully
          - Page header displays REPORTS
          - Form shows Report Type dropdown with options Monthly, Yearly, Custom
          - Start Date and End Date fields are pre-filled for the current month
      - id: MD008-TC002
        title: Generate Monthly report with default date range
        preconditions:
          - User USER0001 is logged in
          - Reports page is open
          - At least one transaction exists within the current month
        steps:
          - Leave Report Type as Monthly
          - Leave Start Date and End Date as pre-filled values
          - Click Generate Report
        expectedResult:
          - Confirmation box appears
          - "Confirmation message reads: Generate a Monthly report from <start> to <end>?"
          - "Two buttons are displayed: Yes, Generate and No, Cancel"
      - id: MD008-TC003
        title: Confirm Monthly report generation and verify results
        preconditions:
          - User USER0001 is logged in
          - Reports page is open with Monthly type and current month dates
          - At least one transaction exists within the current month
        steps:
          - Leave Report Type as Monthly
          - Leave Start Date and End Date as pre-filled values
          - Click Generate Report
          - Click Yes, Generate in the confirmation box
        expectedResult:
          - "Report table appears with columns: Tran ID, Card, Type, Category, Amount, Date, Merchant"
          - Transactions within the current month are listed
          - "A yellow total row appears at the bottom showing Total Amount: $X,XXX.XX"
          - Amounts are formatted as currency
      - id: MD008-TC004
        title: Cancel report generation from confirmation box
        preconditions:
          - User USER0001 is logged in
          - Reports page is open
        steps:
          - Leave Report Type as Monthly
          - Click Generate Report
          - Click No, Cancel in the confirmation box
        expectedResult:
          - Confirmation box disappears
          - No report table is rendered
          - User remains on the Reports page with the form intact
      - id: MD008-TC005
        title: Generate Yearly report
        preconditions:
          - User USER0001 is logged in
          - Reports page is open
          - At least one transaction exists within the current year
        steps:
          - Select Yearly from the Report Type dropdown
          - Verify Start Date and End Date update to cover the full current year
          - Click Generate Report
          - Click Yes, Generate in the confirmation box
        expectedResult:
          - Report table appears with transactions spanning the full current year
          - Yellow total row at bottom shows the summed Total Amount for the year
          - Confirmation message prior to generation referenced Yearly report type
      - id: MD008-TC006
        title: Generate Custom report with a valid custom date range
        preconditions:
          - User USER0001 is logged in
          - Reports page is open
          - Transactions exist within the chosen custom date range
        steps:
          - Select Custom from the Report Type dropdown
          - Enter a valid Start Date (e.g., first day of previous month)
          - Enter a valid End Date (e.g., last day of previous month)
          - Click Generate Report
          - Click Yes, Generate in the confirmation box
        expectedResult:
          - Report table appears showing only transactions within the specified custom date range
          - Yellow total row at bottom shows the correct Total Amount for the range
      - id: MD008-TC007
        title: Generate report with End Date earlier than Start Date
        preconditions:
          - User USER0001 is logged in
          - Reports page is open
        steps:
          - Select Custom from the Report Type dropdown
          - Enter Start Date = today
          - Enter End Date = one month before today
          - Click Generate Report
        expectedResult:
          - Red error message is displayed indicating the date range is invalid
          - No confirmation box appears
          - No report table is rendered
      - id: MD008-TC008
        title: Generate report with no transactions in the selected date range
        preconditions:
          - User USER0001 is logged in
          - Reports page is open
          - No transactions exist in the far-future date range
        steps:
          - Select Custom from the Report Type dropdown
          - Enter Start Date = 2099-01-01
          - Enter End Date = 2099-01-31
          - Click Generate Report
          - Click Yes, Generate in the confirmation box
        expectedResult:
          - Report table appears with no transaction rows, or an informational message indicating no transactions found
          - Total Amount row shows $0.00 or is absent
      - id: MD008-TC009
        title: Navigate to Bill Payment page from navigation bar
        preconditions:
          - User USER0001 is logged in
        steps:
          - Click Bill-Pay in the navigation bar
        expectedResult:
          - Bill Payment page loads successfully
          - Form shows an Account ID input field and a Look Up button
          - No account information is displayed until a lookup is performed
      - id: MD008-TC010
        title: Look up a valid account with a positive balance
        preconditions:
          - User USER0001 is logged in
          - Bill Payment page is open
          - Account 0000000011 exists with a balance greater than $0.00
        steps:
          - Enter 0000000011 in the Account ID field
          - Click Look Up
        expectedResult:
          - Account Information section appears showing Account ID 0000000011 and Current Balance
          - Pay Full Balance button is displayed with the payment amount shown
          - Balance is greater than $0.00
      - id: MD008-TC011
        title: Pay full balance and verify success
        preconditions:
          - User USER0001 is logged in
          - Bill Payment page is open
          - Account 0000000011 has a balance greater than $0.00
        steps:
          - Enter 0000000011 in the Account ID field
          - Click Look Up
          - Click Pay Full Balance
          - Verify confirmation box appears
          - Click Yes, Pay Now
        expectedResult:
          - "Confirmation box reads: Are you sure you want to pay $X,XXX.XX for account 0000000011?"
          - >-
            After clicking Yes, Pay Now, green alert appears: >> Payment successful. Transaction ID: <id>. Amount:
            $X,XXX.XX
          - Account information section clears after successful payment
      - id: MD008-TC012
        title: Cancel bill payment from confirmation box
        preconditions:
          - User USER0001 is logged in
          - Bill Payment page is open
          - Account 0000000011 has a balance greater than $0.00
        steps:
          - Enter 0000000011 in the Account ID field
          - Click Look Up
          - Click Pay Full Balance
          - Click No, Cancel in the confirmation box
        expectedResult:
          - Confirmation box disappears
          - Payment is NOT processed
          - Account Information section still shows the original balance
      - id: MD008-TC013
        title: Look up account with zero balance
        preconditions:
          - User USER0001 is logged in
          - Bill Payment page is open
          - Account 0000000011 has been paid down to $0.00 balance
        steps:
          - Enter 0000000011 in the Account ID field
          - Click Look Up
        expectedResult:
          - Account Information section appears showing Current Balance as $0.00
          - Pay Full Balance button is NOT displayed
          - "Info message shown: You have nothing to pay. Your current balance is $0.00."
      - id: MD008-TC014
        title: Look up a non-existent account in Bill Payment
        preconditions:
          - User USER0001 is logged in
          - Bill Payment page is open
        steps:
          - Enter 9999999999 in the Account ID field
          - Click Look Up
        expectedResult:
          - Red error message is displayed indicating the account was not found
          - No Account Information section or Pay Full Balance button is shown
      - id: MD008-TC015
        title: Submit Bill Payment with empty Account ID field
        preconditions:
          - User USER0001 is logged in
          - Bill Payment page is open
        steps:
          - Leave the Account ID field empty
          - Click Look Up
        expectedResult:
          - Red error message is displayed indicating Account ID is required
          - No account information is displayed
          - No Pay Full Balance button appears
