          - Fill all valid fields with Amount = 1250.75
          - Click Review Transaction
        expectedResult:
          - Confirmation box appears
          - Amount is displayed as $1,250.75 in the summary (formatted with dollar sign and comma separator)
      - id: MD007-TC011
