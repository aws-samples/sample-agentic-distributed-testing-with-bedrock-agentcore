services:
  backend:
    # backend/ and frontend/ share one npm workspace rooted at the repo root
    # (see /package.json) — build context must be the repo root so the
    # Dockerfile can see the root package-lock.json.
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cardtest-v2-backend
    network_mode: host
    environment:
      PORT: "4010"
      TARGET_URL: "${TARGET_URL:-http://localhost:8020}"
      BEDROCK_MODEL: "${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}"
      BROWSER_REGION: "${BROWSER_REGION:-ap-southeast-1}"
      # Required only when AGENT_MODE=agentcore. Set this after deploying
      # agent-runtime-agentcore (see agent-runtime-agentcore/agentcore/) to the
      # ARN of your deployed AgentCore Runtime. Not needed for local mode.
      AGENTCORE_RUNTIME_ARN: "${AGENTCORE_RUNTIME_ARN:-}"
      # 'agentcore' routes to AgentCore Runtime (default)
      # 'local' routes test execution to agent-runtime container (OpenCode + chrome-devtools-mcp)
      AGENT_MODE: "${AGENT_MODE:-agentcore}"
      # Gates the agentcore mode/UI entirely — see backend/src/state/store.js
      # and .env.example.
      ENABLE_AGENTCORE: "${ENABLE_AGENTCORE:-true}"
      LOCAL_RUNTIME_URL: "http://localhost:4020"
      # S3 bucket for evidence snapshots shown in Analysis page. Leave unset
      # to disable snapshot capture entirely — see .env.example.
      S3_SNAPSHOT_BUCKET: "${S3_SNAPSHOT_BUCKET:-}"
      S3_SNAPSHOT_REGION: "${S3_SNAPSHOT_REGION:-ap-southeast-1}"
    volumes:
      # Persists the SQLite DB (test cases, run archive) plus config.json /
      # testResults.json across container rebuilds, not just restarts.
      - backend-state:/app/backend/src/state
    restart: unless-stopped

  # Local agent runtime — OpenCode + chrome-devtools-mcp + local Chromium.
  # Only active when AGENT_MODE=local.
  agent-runtime-local:
    build: ./agent-runtime-local
    container_name: cardtest-v2-agent-runtime-local
    network_mode: host
    profiles:
      - local
    environment:
      PORT: "4020"
      BEDROCK_REGION: "${BEDROCK_REGION:-us-east-1}"
      BEDROCK_MODEL: "${BEDROCK_MODEL:-amazon-bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0}"
      # Point to a Chrome instance with remote debugging enabled.
      # Leave blank to let chrome-devtools-mcp auto-launch Chrome.
      CHROME_DEVTOOLS_URL: "${CHROME_DEVTOOLS_URL:-}"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cardtest-v2-frontend
    network_mode: host
    restart: unless-stopped

volumes:
  backend-state:
